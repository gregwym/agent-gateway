[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-gateway"
version = "0.1.0"
description = "A small self-hosted MCP gateway for a household: per-person identity, tool allowlists, credential isolation, audit."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # The MCP transports, auth middleware and client all come from the official SDK.
    "mcp>=2.3,<3",
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
    "cryptography>=43",
    "jsonschema>=4.20,<5",
    "referencing>=0.35",
    "uvicorn>=0.30",
    # WebAuthn verification for passkey approvals. Used only when `approvals:` is configured.
    "fido2>=2.2,<3",
    # Already required by the SDK; named here because the gateway imports it directly.
    "httpx2>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agw = "agent_gateway.cli:main"

[tool.setuptools]
packages = ["agent_gateway"]

[tool.setuptools.package-data]
agent_gateway = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
