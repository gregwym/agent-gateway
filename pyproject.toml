[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-gateway"
version = "0.23.0"
description = "A small self-hosted MCP gateway for a household: per-person identity, tool allowlists, credential isolation, audit."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # The MCP transports, auth middleware and client all come from the official SDK.
    "mcp>=2.3,<3",
    "pydantic>=2.12,<3",
    "PyYAML>=6,<7",
    "cryptography>=43",
    "jsonschema>=4.20,<5",
    "graphql-core>=3.2.14,<3.3",
    "referencing>=0.35",
    "uvicorn>=0.30",
    # WebAuthn verification for passkey approvals. Used only when `approvals:` is configured.
    "fido2>=2.2,<3",
    # Already required by the SDK; named here because the gateway imports it directly.
    "httpx2>=2,<3",
]

[project.optional-dependencies]
# The bundled connectors for IMAP mail and CalDAV calendars. The Gmail connector needs nothing extra.
connectors = ["IMAPClient>=4.1,<5", "caldav>=3.7,<4"]
# The one-time Google consent helper. For a computer with a browser, not for the gateway host.
gmail-auth = ["google-auth-oauthlib>=1.2,<2"]
# The Reminders connector, which runs natively on macOS.
macos = ["pyobjc-framework-EventKit>=10; sys_platform == 'darwin'"]
# The tests run the connectors against real local servers: pymap (IMAP) and Radicale (CalDAV).
dev = [
    "agent-gateway[connectors,gmail-auth,macos]",
    "pytest>=8",
    "pymap>=0.36,<0.37",
    "Radicale>=3.5,<4",
]

browser-tests = ["playwright>=1.51,<2"]

[project.scripts]
agw = "agent_gateway.cli:main"

[tool.setuptools]
packages = ["agent_gateway", "agent_gateway.connectors"]

[tool.setuptools.package-data]
agent_gateway = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: Chromium approval-page acceptance with a virtual authenticator",
    "docker: disposable container acceptance (scripts/acceptance.py --docker)",
]
filterwarnings = ["ignore::DeprecationWarning"]
