# Run from this directory. With the images CI published for a commit on master
# (AGW_IMAGE and AGW_BROWSER_IMAGE, usually set in .env next to this file):
#   docker compose pull && docker compose up -d --no-build
# To build on this host instead, leave both unset:  docker compose up -d --build
#
# Host layout (AGW_HOME, default ./data), all owned by uid 10001:
#   config/gateway.yaml, config/tools.lock.json   read-only for the running gateway
#   secrets/secrets.enc                            encrypted upstream credentials
#   state/audit/                                   audit log
#   state/approvals.sqlite                         passkeys and approval requests, if `approvals:` is configured
#                                                  (state/ is the only place the gateway writes)
# and, kept apart so one backup job does not pick up both halves:
#   AGW_KEY_DIR (default ./data/key)/master.key    the key for secrets.enc
#
# This file hardens the container. It does not make the host safe: anyone with
# root or Docker access on this host can read the key. See docs/deployment.md.

name: agent-gateway

x-gateway: &gateway
  build: ..
  image: ${AGW_IMAGE:-agent-gateway:local}
  user: "10001:10001"
  init: true            # reaps whatever connector processes leave behind
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]

services:
  gateway:
    <<: *gateway
    restart: unless-stopped
    environment:
      AGW_BROWSER_SOCKET: /browser/control.sock
    ports:
      # One address only. Set AGW_BIND to this host's Tailscale IP; never 0.0.0.0.
      - "${AGW_BIND:-127.0.0.1}:${AGW_PORT:-8080}:8080"
    volumes:
      - ${AGW_HOME:-./data}/config:/config:ro
      - ${AGW_HOME:-./data}/secrets:/secrets:ro
      - ${AGW_KEY_DIR:-./data/key}:/key:ro
      - ${AGW_HOME:-./data}/state:/state
      - browser-sockets:/browser
      - amazon-orders-socket:/sidecars/amazon-orders
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # The browser has no network or Gateway data mounts. A Unix socket allows
  # admin control; website HTTPS goes through a per-login, restricted tunnel.
  browser:
    build:
      context: ..
      target: login-browser
    image: ${AGW_BROWSER_IMAGE:-agent-gateway-browser:local}
    user: "10001:10001"
    restart: unless-stopped
    network_mode: none
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=384m,mode=1777"]
    shm_size: 128mb
    mem_limit: 768m
    pids_limit: 256
    volumes: ["browser-sockets:/browser"]
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx2; r=httpx2.Client(transport=httpx2.HTTPTransport(uds='/browser/control.sock'), timeout=3).post('http://browser/health'); r.raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3

  # The Amazon Orders connector (docs/deployment.md, "Amazon 订单"), started only with
  # `--profile amazon-orders`. Same image; it holds the Amazon session and no Gateway data,
  # and uses a separate network. The gateway reaches it over the socket.
  amazon-orders:
    <<: *gateway
    profiles: ["amazon-orders"]
    restart: unless-stopped
    entrypoint: ["python", "-m", "agent_gateway.sidecar", "/sidecars/amazon-orders/control.sock"]
    mem_limit: 384m
    pids_limit: 128
    networks: [amazon-orders]
    volumes:
      - amazon-orders-socket:/sidecars/amazon-orders
      - amazon-orders-state:/var/lib/amazon-orders   # the live session (cookies.json)
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.socket(socket.AF_UNIX).connect('/sidecars/amazon-orders/control.sock')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # One-off admin commands, run by a human on this host. Same image, writable mounts:
  #   docker compose run --rm admin secret init
  #   docker compose run --rm admin secret set notes_key_a
  #   docker compose run --rm admin lock --write
  #   docker compose run --rm admin check
  admin:
    <<: *gateway
    profiles: ["admin"]
    volumes:
      - ${AGW_HOME:-./data}/config:/config
      - ${AGW_HOME:-./data}/secrets:/secrets
      - ${AGW_KEY_DIR:-./data/key}:/key
      - ${AGW_HOME:-./data}/state:/state

volumes:
  browser-sockets:
  amazon-orders-socket:
  amazon-orders-state:

networks:
  amazon-orders:
